<!-- Login View Template -->
<div class="login-view" style="max-width: 480px; margin: 3rem auto;">
  <div style="background: #FFFFFF; padding: 2.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); border: 1px solid var(--border);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div id="loginLogo" style="width: 54px; height: 54px; border-radius: var(--radius-md); background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 0.75rem;">
        <i class="fa-solid fa-pepper-hot"></i>
      </div>
      <h2 style="font-size: 1.8rem; color: var(--text-main);">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to your SpiceSense Chef Account</p>
    </div>

    <div ng-if="vm.errorMessage" id="errorMessage" class="error-message" style="background: #FEF2F2; color: #991B1B; padding: 0.75rem 1rem; border-radius: var(--radius-sm); border: 1px solid #FCA5A5; margin-bottom: 1.25rem; font-size: 0.9rem;">
      <i class="fa-solid fa-circle-exclamation"></i> {{vm.errorMessage}}
    </div>

    <!-- AngularJS Form with Validation -->
    <form name="loginForm" ng-submit="vm.login()" novalidate>
      <div style="margin-bottom: 1.25rem;">
        <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.4rem;">EMAIL ADDRESS</label>
        <input type="email" id="email" name="userEmail" ng-model="vm.loginData.email" required placeholder="chef@spicesense.in" class="form-control" style="width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border); outline: none;">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.4rem;">PASSWORD</label>
        <input type="password" id="password" name="userPass" ng-model="vm.loginData.password" required placeholder="••••••••" class="form-control" style="width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border); outline: none;">
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; padding: 0.85rem;" ng-disabled="vm.isSubmitting || loginForm.$invalid">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.9rem;">
      Don't have an account? <a href="#!/register" style="font-weight: 700;">Register Here</a>
    </div>
  </div>
</div>
