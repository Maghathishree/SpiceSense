<!-- Register View Template -->
<div class="register-view" style="max-width: 520px; margin: 2rem auto;">
  <div style="background: #FFFFFF; padding: 2.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); border: 1px solid var(--border);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="font-size: 1.8rem; color: var(--text-main);">Create Your Account</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Join SpiceSense to save favorites, log cooking history & track nutrition</p>
    </div>

    <div ng-if="vm.errorMessage" style="background: #FEF2F2; color: #991B1B; padding: 0.75rem 1rem; border-radius: var(--radius-sm); border: 1px solid #FCA5A5; margin-bottom: 1.25rem; font-size: 0.9rem;">
      <i class="fa-solid fa-circle-exclamation"></i> {{vm.errorMessage}}
    </div>

    <form name="regForm" ng-submit="vm.register()" novalidate>
      <div style="margin-bottom: 1.25rem;">
        <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.4rem;">FULL NAME / USERNAME</label>
        <input type="text" name="regUser" ng-model="vm.registerData.username" required minlength="3" placeholder="e.g. Sundar Raman" class="form-control" style="width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border); outline: none;">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.4rem;">EMAIL ADDRESS</label>
        <input type="email" name="regEmail" ng-model="vm.registerData.email" required placeholder="sundar@example.com" class="form-control" style="width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border); outline: none;">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
        <div>
          <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.4rem;">PASSWORD</label>
          <input type="password" name="regPass" ng-model="vm.registerData.password" required minlength="6" placeholder="••••••••" class="form-control" style="width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border); outline: none;">
        </div>
        <div>
          <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.4rem;">CONFIRM PASSWORD</label>
          <input type="password" name="regConf" ng-model="vm.registerData.confirmPassword" required placeholder="••••••••" class="form-control" style="width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border); outline: none;">
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem;" ng-disabled="vm.isSubmitting || regForm.$invalid">
        <i class="fa-solid fa-user-plus"></i> Create Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.9rem;">
      Already have an account? <a href="#!/login" style="font-weight: 700;">Login Here</a>
    </div>
  </div>
</div>
